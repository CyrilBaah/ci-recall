name: Collector

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: collector-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: recall
      deployment: false
    steps:
      # Checks out the collector code from main, never the code of the run being recorded
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recall/requirements.txt
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install collector dependencies
        run: pip install -r recall/requirements.txt
      - name: Record the run in TimescaleDB
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_RECALL_DATABASE_URL: ${{ secrets.CI_RECALL_DATABASE_URL }}
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: python -m recall.collector
